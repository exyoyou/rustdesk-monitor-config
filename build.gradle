plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

// 默认配置（assets/monitor_config_default.json）里 WebDAV 密码留空，编译时注入：
// 优先环境变量 MONITOR_WEBDAV_PASSWORD，其次 flutter/android/local.properties 的 monitor.webdav.password
def webdavPassword = System.getenv('MONITOR_WEBDAV_PASSWORD')
if (webdavPassword == null || webdavPassword.isEmpty()) {
    def localProps = new Properties()
    def localPropsFile = rootProject.file('local.properties')
    if (localPropsFile.exists()) {
        localPropsFile.withReader('UTF-8') { localProps.load(it) }
    }
    webdavPassword = localProps.getProperty('monitor.webdav.password', '')
}
// 不以明文进 APK：每次构建随机生成 key，密码按字节 XOR 后连同 key 以 hex 写入 BuildConfig。
// 只防 strings/jadx 一眼看到明文，不是真正的加密。
def webdavPasswordBytes = webdavPassword.getBytes('UTF-8')
def webdavPasswordKey = new byte[webdavPasswordBytes.length]
new java.security.SecureRandom().nextBytes(webdavPasswordKey)
def webdavPasswordCipher = new byte[webdavPasswordBytes.length]
for (int i = 0; i < webdavPasswordBytes.length; i++) {
    webdavPasswordCipher[i] = (byte) (webdavPasswordBytes[i] ^ webdavPasswordKey[i])
}
def webdavPasswordCipherHex = webdavPasswordCipher.encodeHex().toString()
def webdavPasswordKeyHex = webdavPasswordKey.encodeHex().toString()

android {
    namespace 'youyou.monitor.config'
    compileSdk 34

    defaultConfig {
        minSdk 22

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        buildConfigField "String", "DEFAULT_WEBDAV_PASSWORD_CIPHER", "\"${webdavPasswordCipherHex}\""
        buildConfigField "String", "DEFAULT_WEBDAV_PASSWORD_KEY", "\"${webdavPasswordKeyHex}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.21"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}